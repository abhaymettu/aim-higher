<svg xmlns="http://www.w3.org/2000/svg" width="880" height="270" viewBox="0 0 880 270" role="img" aria-labelledby="t d">
  <title id="t">aim-higher workflow</title>
  <desc id="d">Four steps in order: pin the outcome, set the bar, do the work, check and report. A stop line under the steps lists actions the skill never takes on its own: spending, sending, publishing, deleting out-of-scope data, revealing secrets, getting around security.</desc>
  <style>
    .card { fill: #ffffff; stroke: #d0d7de; }
    .step { fill: #f6f8fa; stroke: #d0d7de; }
    .num { font: 600 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #57606a; letter-spacing: 0.04em; }
    .head { font: 600 16px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2328; }
    .body { font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #57606a; }
    .arrow { stroke: #8c959f; stroke-width: 1.5; fill: none; }
    .stop { fill: #fff8f5; stroke: #e5b5a3; }
    .stoptext { font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #8a3b1f; }
    .stophead { font: 600 13px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #8a3b1f; }
    @media (prefers-color-scheme: dark) {
      .card { fill: #0d1117; stroke: #30363d; }
      .step { fill: #161b22; stroke: #30363d; }
      .num, .body { fill: #9198a1; }
      .head { fill: #f0f6fc; }
      .arrow { stroke: #656c76; }
      .stop { fill: #2a1712; stroke: #6e3b2a; }
      .stoptext, .stophead { fill: #f0a98e; }
    }
  </style>
  <rect class="card" x="0.5" y="0.5" width="879" height="269" rx="12"/>

  <g transform="translate(24 24)">
    <rect class="step" width="186" height="130" rx="8"/>
    <text class="num" x="16" y="26">STEP 1</text>
    <text class="head" x="16" y="50">Pin the outcome</text>
    <text class="body" x="16" y="74">What must be true at</text>
    <text class="body" x="16" y="92">the end, where scope</text>
    <text class="body" x="16" y="110">stops, the user's limits</text>
  </g>
  <path class="arrow" d="M214 89 h20 m-6 -5 l6 5 l-6 5"/>

  <g transform="translate(238 24)">
    <rect class="step" width="186" height="130" rx="8"/>
    <text class="num" x="16" y="26">STEP 2</text>
    <text class="head" x="16" y="50">Set the bar</text>
    <text class="body" x="16" y="74">Expert moves, raw</text>
    <text class="body" x="16" y="92">evidence, fitting methods,</text>
    <text class="body" x="16" y="110">a pass/fail check first</text>
  </g>
  <path class="arrow" d="M428 89 h20 m-6 -5 l6 5 l-6 5"/>

  <g transform="translate(452 24)">
    <rect class="step" width="186" height="130" rx="8"/>
    <text class="num" x="16" y="26">STEP 3</text>
    <text class="head" x="16" y="50">Do the work</text>
    <text class="body" x="16" y="74">Reproduce, fix the cause,</text>
    <text class="body" x="16" y="92">read primary sources;</text>
    <text class="body" x="16" y="110">not a better prompt</text>
  </g>
  <path class="arrow" d="M642 89 h20 m-6 -5 l6 5 l-6 5"/>

  <g transform="translate(666 24)">
    <rect class="step" width="190" height="130" rx="8"/>
    <text class="num" x="16" y="26">STEP 4</text>
    <text class="head" x="16" y="50">Check and report</text>
    <text class="body" x="16" y="74">Run the check, show its</text>
    <text class="body" x="16" y="92">real output, name what</text>
    <text class="body" x="16" y="110">was not verified, stop</text>
  </g>

  <g transform="translate(24 172)">
    <rect class="stop" width="832" height="74" rx="8"/>
    <text class="stophead" x="16" y="23">Stop line: never on its own</text>
    <text class="stoptext" x="16" y="42">Spending, sending, publishing, deleting out-of-scope data, revealing secrets, getting around security.</text>
    <text class="stoptext" x="16" y="60">It prepares everything up to the line, then asks one question.</text>
  </g>
</svg>
